name: travel-goods-site CI

# 旅行用品比較サイト（travel-goods-site/）専用のCI。
# 同じリポジトリにある既存サイト（mugi-no-mi-nextjs/）には触れない。
on:
  push:
    branches: ['**']
    paths:
      - 'travel-goods-site/**'
      - '.github/workflows/travel-goods-ci.yml'
  pull_request:
    paths:
      - 'travel-goods-site/**'
      - '.github/workflows/travel-goods-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: travel-goods-site

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: travel-goods-site/package-lock.json

      - name: 依存関係のインストール
        run: npm ci

      - name: 型検査
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: 単体テスト
        run: npm test

      - name: データ・記事の検証（本番／デモ両方）
        run: npm run validate:content:all

      - name: 静的出力ビルド（デモデータ）
        run: npm run build:only

      - name: 公開前チェック（プレビュー設定では未達項目が出るため参考表示）
        run: npm run check:release -- --out out || true

      - name: Playwright ブラウザの取得
        run: npx playwright install --with-deps chromium

      - name: E2E テスト（デモデータ + CTA表示確認）
        run: npm run test:e2e

      - name: E2E テスト（本番データ）
        run: npm run test:e2e:production

      - name: E2E テスト（購入導線の通し確認：表示・遷移先・クリック計測）
        run: npm run test:e2e:linkcheck

      - name: 本番データでの公開前チェック（配信物に架空データが無いこと）
        run: |
          CATALOG_DATASET=production npm run build:only
          CATALOG_DATASET=production npm run check:release -- --out out || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: travel-goods-site/playwright-report/
          retention-days: 7
